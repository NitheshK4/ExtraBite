name: extrabite_mobile
description: "ExtraBite Native Mobile App - Rescuing PG Surplus Meals"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Backend & Network
  supabase_flutter: ^2.5.0
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0

  # Location & Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Permissions & Hardware
  permission_handler: ^11.3.1
  image_picker: ^1.1.0
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  # Utilities & UI
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
