name: Flutter CI

on:
  push:
    branches: [ "main", "nk" ]
  pull_request:
    branches: [ "main", "nk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExtraBiteMobile

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrabite-app-debug
          path: ExtraBiteMobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "ExtraBite App Release v1.0.0"
          body: "Official Android APK build for ExtraBite Mobile Application."
          files: ExtraBiteMobile/build/app/outputs/flutter-apk/app-debug.apk



