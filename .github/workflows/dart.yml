name: ExtraBite CI/CD

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =========================================================================
  # Mobile CI (Android APK & Tests)
  # =========================================================================
  mobile-ci:
    name: Mobile CI & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExtraBiteMobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Test Suite (57 tests)
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrabite-mobile-release-apk
          path: ExtraBiteMobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # =========================================================================
  # Admin Web CI (Web Build & Tests)
  # =========================================================================
  admin-web-ci:
    name: Admin Web CI & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExtraBiteAdmin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Test Suite (12 tests)
        run: flutter test

      - name: Build Release Web
        run: flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrabite-admin-web-build
          path: ExtraBiteAdmin/build/web/
          if-no-files-found: error

  # =========================================================================
  # Automated Release (on Git Tag)
  # =========================================================================
  release:
    name: Publish Release
    needs: [mobile-ci, admin-web-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Mobile APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: extrabite-mobile-release-apk
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "ExtraBite ${{ github.ref_name }}"
          body: |
            ## ExtraBite Release ${{ github.ref_name }}

            ### 📱 What's Included:
            - **ExtraBite Mobile Release APK** (`app-release.apk`)
            - **ExtraBite Admin Web Operations Portal**

            ### 🔐 Verification:
            Automated test suites passed across Mobile (57 tests) and Admin Web (12 tests).
          files: release-artifacts/app-release.apk
