name: Flutter CI

on:
  push:
    branches: [ "main", "nk" ]
  pull_request:
    branches: [ "main", "nk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExtraBiteMobile

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug
          mkdir -p ../build/app/outputs/flutter-apk
          cp build/app/outputs/apk/debug/app-debug.apk ../build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrabite-app-debug
          path: |
            ExtraBiteMobile/android/build/app/outputs/apk/debug/app-debug.apk
            ExtraBiteMobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "ExtraBite App Release ${{ github.ref_name }}"
          body: "Official Android APK build for ExtraBite Mobile Application."
          files: |
            ExtraBiteMobile/android/build/app/outputs/apk/debug/app-debug.apk
            ExtraBiteMobile/build/app/outputs/flutter-apk/app-debug.apk





