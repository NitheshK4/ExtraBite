name: extrabite_mobile
description: ExtraBite - Native Mobile Surplus Food Discovery & Reservation Platform for PGs and Hostels.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend & Network
  supabase_flutter: ^2.5.6
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0

  # Location & Maps
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Permissions & Native Hardware
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Utilities & Formatting
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
